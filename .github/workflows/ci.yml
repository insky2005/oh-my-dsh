name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Shared core (Node) unit tests — fast, platform-independent -----------
  core:
    name: core (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: core unit tests
        run: node --test "core/tests/*.test.js"

  # --- macOS shell: unit tests + swiftc compile check (fast, no build) ------
  swift:
    name: swift tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Terminal emulator tests (migrated to core)
        run: node --test core/tests/ansi.test.js
      - name: Wiki panel tests
        run: tests/wiki-panel/run.sh
      - name: swiftc compile check (all sources)
        run: |
          mkdir -p .build/module-cache
          swiftc -O -swift-version 5 -module-cache-path .build/module-cache \
            -framework AppKit -framework WebKit -framework PDFKit \
            -o /tmp/oh-my-dsh-check \
            src/main.swift src/PreviewPanel.swift src/TerminalPanel.swift src/WikiPanel.swift
          file /tmp/oh-my-dsh-check

  # --- Full app build matrix: arm64 / x86_64 / universal --------------------
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
          - arch: universal
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache runtime + node tarballs (.cache/)
        uses: actions/cache@v4
        with:
          path: .cache
          key: cache-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('build-app.sh', 'scripts/version.sh') }}
          restore-keys: |
            cache-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build app
        env:
          DSH_ARCH: ${{ matrix.arch }}
        run: ./build-app.sh
      - name: Verify bundle
        run: |
          test -x dist/oh-my-dsh.app/Contents/MacOS/oh-my-dsh
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/oh-my-dsh.app/Contents/Info.plist
          du -sh dist/oh-my-dsh.app
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-dsh-${{ matrix.arch }}
          path: dist/oh-my-dsh.app
          if-no-files-found: error
