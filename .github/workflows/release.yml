name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同一 tag 重复触发时取消旧 run；不同 tag 的发布排队，避免互相挤占 macOS runner。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build all three artifacts on macOS (arm64 / x86_64 / universal).
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 在 macos-14 (arm64) 上交叉编译（build-app.sh 用 -target 交叉构建），
          # 不再依赖退役中的 macos-13 runner（容量极低、排队严重）。
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-14
          - arch: universal
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.sh reads tags
      - name: Cache runtime + node tarballs (.cache/)
        uses: actions/cache@v6
        with:
          path: .cache
          key: release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('platforms/macos/build-app.sh', 'scripts/version.sh') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.arch }}-
      - name: Build app
        env:
          DSH_ARCH: ${{ matrix.arch }}
        run: ./platforms/macos/build-app.sh
      - name: Package .pkg + .dmg
        env:
          DSH_ARCH: ${{ matrix.arch }}
        run: ./platforms/macos/make-pkg.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/oh-my-dsh-*.pkg
            dist/oh-my-dsh-*.dmg
          if-no-files-found: error

  # Aggregate everything, checksum, and publish the GitHub Release.
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Collect release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dist && mkdir -p dist
          cp dist-artifacts/*.pkg dist-artifacts/*.dmg dist/ 2>/dev/null || true
          ls -la dist/
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Write SHA-256SUMS + release notes
        id: checksums
        run: |
          chmod +x scripts/release-checksums.sh
          scripts/release-checksums.sh "$VERSION" | tee /tmp/release-body.txt
      - name: Publish GitHub Release (gh release create)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等发布：先删同名旧 Release（连同 tag，--cleanup-tag），再用
          # --target 从当前 commit 重建 tag + Release + 资产。避免 softprops
          # action / --clobber 在「tag 已存在」时的 already_exists 与竞态。
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --title "oh-my-dsh $VERSION" \
            --notes-file /tmp/release-body.txt \
            --prerelease \
            dist/*.pkg dist/*.dmg dist/SHA-256SUMS
          gh release view "$GITHUB_REF_NAME" --json name,isPrerelease,assets --jq \
            '{name, isPrerelease, assets: [.assets[].name]}'
