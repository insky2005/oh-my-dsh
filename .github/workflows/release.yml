name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同一 tag 重复触发时取消旧 run；不同 tag 的发布排队，避免互相挤占 macOS runner。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前置准备：预编译双架构 CEF 产物 + 预下载 node + 预取 runtime，统一缓存。
  # 随后的三架构 build 矩阵通过 needs 依赖它，直接命中缓存，避免各 job 并行
  # 冷启动下载/重编 CEF。
  prepare:
    name: prepare (CEF + node caches)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Cache CEF + node + built artifacts (.cache/)
        uses: actions/cache@v6
        with:
          path: .cache
          key: release-${{ runner.os }}-prepare-${{ hashFiles('platforms/macos/build-app.sh', 'platforms/macos/build-cef.sh', 'scripts/version.sh') }}
      - name: Pre-build CEF artifacts (arm64 + x86_64) + prefetch node/runtime
        run: |
          mkdir -p .build/module-cache
          platforms/macos/build-cef.sh arm64
          platforms/macos/build-cef.sh x86_64
          ./platforms/macos/build-app.sh --prefetch

  # Build both artifacts on macOS (arm64 / x86_64; no universal).
  build:
    name: build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 在 macos-14 (arm64) 上交叉编译（build-app.sh 用 -target 交叉构建），
          # 不再依赖退役中的 macos-13 runner（容量极低、排队严重）。
          # 产品只出 arm64 / x86_64，不再出 universal。
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # version.sh reads tags
      - name: Cache runtime + node tarballs (.cache/)
        uses: actions/cache@v6
        with:
          path: .cache
          key: release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('platforms/macos/build-app.sh', 'scripts/version.sh') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.arch }}-
            # 复用前置 prepare 的 .cache/（双架构 CEF tarball + 编译产物 + node + runtime）
            release-${{ runner.os }}-prepare-
      - name: Build app
        env:
          DSH_ARCH: ${{ matrix.arch }}
          # GitHub runner 在美国：显式走官方 npm registry / Node 镜像（权威、
          # 无镜像同步滞后）；本地脚本默认保持 npmmirror（国内更快）。
          DSH_NPM_REGISTRY: https://registry.npmjs.org
          DSH_NODE_MIRROR: https://nodejs.org/dist
        run: ./platforms/macos/build-app.sh
      - name: Package .pkg + .dmg
        env:
          DSH_ARCH: ${{ matrix.arch }}
        run: ./platforms/macos/make-pkg.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/oh-my-dsh-*.pkg
            dist/oh-my-dsh-*.dmg
          if-no-files-found: error

  # Aggregate everything, checksum, and publish the GitHub Release.
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Collect release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dist && mkdir -p dist
          cp dist-artifacts/*.pkg dist-artifacts/*.dmg dist/ 2>/dev/null || true
          ls -la dist/
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Write SHA-256SUMS + release notes
        id: checksums
        run: |
          chmod +x scripts/release-checksums.sh
          scripts/release-checksums.sh "$VERSION" | tee /tmp/release-body.txt
      - name: Publish GitHub Release (gh release create)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等发布：先删同名旧 Release（连同 tag，--cleanup-tag），再用
          # --target 从当前 commit 重建 tag + Release + 资产。避免 softprops
          # action / --clobber 在「tag 已存在」时的 already_exists 与竞态。
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --title "oh-my-dsh $VERSION" \
            --notes-file /tmp/release-body.txt \
            --prerelease \
            dist/*.pkg dist/*.dmg dist/SHA-256SUMS
          gh release view "$GITHUB_REF_NAME" --json name,isPrerelease,assets --jq \
            '{name, isPrerelease, assets: [.assets[].name]}'
