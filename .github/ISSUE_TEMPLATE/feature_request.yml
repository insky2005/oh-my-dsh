name: Feature Request
description: 提议一个新功能 / Suggest a feature
title: "[feature]: "
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请描述清楚「做什么、为什么、怎么验收」。
        Thanks for the idea! Please describe what, why, and how to verify.
  - type: textarea
    id: feature
    attributes:
      label: 功能描述 / Feature
      description: 你想要什么能力？
      placeholder: "例如：终端面板支持查找（⌘F）"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 动机 / Motivation
      description: 为什么需要它？解决了什么痛点？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收想法 / Acceptance ideas
      description: 如何判断这个功能做成了？（可留空，维护者会补）
      placeholder: |
        - [ ] 打开终端面板后 ⌘F 弹出查找栏
        - [ ] 输入内容高亮匹配并支持回车跳转
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你试过的其他方式或考虑过的替代设计
  - type: textarea
    id: notes
    attributes:
      label: 备注 / Notes
      description: 补充说明、截图、相关 issue 链接等
