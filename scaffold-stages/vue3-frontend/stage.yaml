id: vue3-frontend
name: { zh: Vue3 前端（Vite+TS+Vitest）, en: Vue3 Frontend (Vite+TS+Vitest) }
category: examples
description:
  zh: 最小可运行的 Vue 3 + Vite + TypeScript 前端骨架（含 vitest 单测示例）；输出到项目下独立子目录，可与后端示例并存
  en: Minimal runnable Vue 3 + Vite + TypeScript frontend skeleton (with vitest); emitted into its own subdir so it can coexist with backend examples
params:
  - key: dir
    label: { zh: 子目录（相对项目根）, en: Subdirectory (relative to project root) }
    type: string
    default: vue3-frontend
    validate: safePath
  - key: registry
    label: { zh: npm registry（项目级 .npmrc）, en: npm registry (project .npmrc) }
    type: select
    options: [npmjs, cnpm, system]
    default: npmjs
  - key: apiBase
    label: { zh: API 基础路径, en: API base path }
    type: string
    default: /api
  - key: vitePort
    label: { zh: 开发服务器端口, en: Dev server port }
    type: string
    default: "5173"
    validate: nonEmpty
files:
  - path: "{{dir}}/.npmrc"
    template: templates/npmrc-npmjs.tmpl
    if: registry=npmjs
  - path: "{{dir}}/.npmrc"
    template: templates/npmrc-cnpm.tmpl
    if: registry=cnpm
  - path: "{{dir}}/Makefile"
    template: templates/Makefile.tmpl
  - path: "{{dir}}/package.json"
    template: templates/package.json.tmpl
  - path: "{{dir}}/vite.config.ts"
    template: templates/vite.config.ts.tmpl
  - path: "{{dir}}/tsconfig.json"
    template: templates/tsconfig.json.tmpl
  - path: "{{dir}}/index.html"
    template: templates/index.html.tmpl
  - path: "{{dir}}/src/main.ts"
    template: templates/main.ts.tmpl
  - path: "{{dir}}/src/App.vue"
    template: templates/App.vue.tmpl
  - path: "{{dir}}/src/components/HelloWorld.vue"
    template: templates/HelloWorld.vue.tmpl
  - path: "{{dir}}/src/style.css"
    template: templates/style.css.tmpl
  - path: "{{dir}}/src/env.d.ts"
    template: templates/env.d.ts.tmpl
  - path: "{{dir}}/src/api/client.ts"
    template: templates/client.ts.tmpl
  - path: "{{dir}}/src/lib/counter.ts"
    template: templates/counter.ts.tmpl
  - path: "{{dir}}/src/lib/counter.spec.ts"
    template: templates/counter.spec.ts.tmpl
